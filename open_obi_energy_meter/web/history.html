<!doctype html><html><head><meta charset=utf-8><link rel=icon href=/favicon.svg>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>OBI · History</title>
<style>
:root{--bg:#0a0e14;--panel:#141a23;--panel2:#1b2430;--line:#232e3c;--txt:#eaf0f7;--dim:#7d8da0;--accent:#31d07a;--accent2:#12a35a;--amber:#e3b341;--red:#f0616d;--blue:#5aa9ff;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 18px;background:#0c1219;border-bottom:1px solid var(--line)}
header b{font-size:15px;white-space:nowrap}
.sp{flex:1}
select,button{font-size:14px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
button{cursor:pointer}
header a{color:var(--accent);text-decoration:none;font-size:13px;white-space:nowrap}
.wrap{max-width:920px;margin:0 auto;padding:16px 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 3px;font-size:15px}
.cap{color:var(--dim);font-size:12px;margin:0 0 12px}
.pricebox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);white-space:nowrap}
.pricebox small{color:var(--dim)}
#price,#eprice{width:76px;font-size:16px;text-align:right}
#psaved,#esaved{color:var(--accent);font-size:12px}
.dllabel{color:var(--dim);font-size:12px;white-space:nowrap}
.langtog{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.langtog button{border:0;border-radius:0;padding:8px 10px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--dim)}
.langtog button.on{background:var(--accent2);color:#fff}
#expTog{font-size:12px;font-weight:600;color:var(--dim)}
#expTog.off{opacity:.55}
.euro{color:var(--amber)}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:9px;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.kpi{flex:1 1 130px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.kpi .v{font-size:21px;font-weight:600;font-family:var(--mono)}
.kpi .l{font-size:11px;color:var(--dim);margin-top:2px}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
td.mono{font-family:var(--mono)}
.pos{color:var(--accent)}.neg{color:var(--blue)}.na{color:var(--dim)}
.empty{color:var(--dim);padding:26px 6px;text-align:center}
.warn{background:#2a1e12;border:1px solid #4a3418;color:var(--amber);border-radius:11px;padding:10px 13px;font-size:12.5px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.msg{font-size:12.5px;color:var(--dim)}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
input[type=number]{font-size:14px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 11px;width:100%}
@media (max-width:760px){
 header{position:static;flex-wrap:wrap;gap:9px;padding:11px 13px}
 .sp{display:none}
 header a{margin-left:auto}
 #rsel{flex:1 1 100%}
 .wrap{padding:13px 12px}
 .card{padding:13px 12px;border-radius:13px}
 .kpi{flex:1 1 calc(50% - 5px)}
 .kpi .v{font-size:18px}
}

const t=k=>T[lang][k];
const loc=()=>numFmt===1?'de-DE':numFmt===2?'en-GB':(lang==='de'?'de-DE':'en-GB');
const nf=(v,d=2)=>Number(v).toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d});
const p2=n=>n<10?'0'+n:''+n;
const D=ep=>new Date(ep*1000);
const hm=ep=>{const d=D(ep);return p2(d.getHours())+':'+p2(d.getMinutes());};
const dm=ep=>{const d=D(ep);return lang==='de'?p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.':p2(d.getDate())+'/'+p2(d.getMonth()+1);};
const dmy=ep=>{const d=D(ep);return lang==='de'?p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear():p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();};

 $('rf').title=t('reload');$('dllabel').textContent=t('dlLabel');$('dlraw').title=t('dlRawT');$('dldaily').title=t('dlDailyT');$('clr').title=t('clearT');$('pbox').title=t('priceT');$('ebox').title=t('priceTexp');

// Purely a per-browser display preference for readers without feed-in (e.g. no PV) -- localStorage only, keyed

// columns on THIS page by folding into the existing anyExp gate that those already render behind (see load()).
const expHideKey=id=>'obiHideExp_'+id;

// ---- inline SVG line chart: series=[{name,color,pts:[[xEpoch,y]...]}] ----
function lineChart(series,unit,zeroLine){
 const W=760,H=300,pl=76,pr=16,pt=16,pb=34;   // wider left margin: labels can be e.g. "83,077.992"
 let xs=[],ys=[];series.forEach(s=>s.pts.forEach(p=>{xs.push(p[0]);ys.push(p[1]);}));
 if(xs.length<2)return '<div class=empty>'+t('fewPts')+'</div>';
 let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 if(x1===x0)x1=x0+1;
 // decimals + padding from the REAL data span (before padding). A cumulative meter reading is huge
 // (~83000) but the change lives in the 3rd decimal; and a flat series (e.g. export that barely moves)
 // must NOT be inflated to 5% of its absolute value — that hid the fine values behind 1 decimal.
 const dr=y1-y0,ydec=dr>=100?0:dr>=10?1:dr>=1?2:3;
 let pad=dr>0?dr*0.08:0.002;y0-=pad;y1+=pad;if(Math.min(...ys)>=0&&y0<0)y0=0;if(y1===y0)y1=y0+1;
 const X=v=>pl+(v-x0)/(x1-x0)*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
 let g='';const ny=4;
 for(let i=0;i<=ny;i++){const yv=y0+(y1-y0)*i/ny,yy=Y(yv);
  g+=`<line x1=${pl} y1=${yy.toFixed(1)} x2=${W-pr} y2=${yy.toFixed(1)} stroke="#232e3c"/>`;
  g+=`<text x=${pl-8} y=${(yy+4).toFixed(1)} text-anchor=end fill="#7d8da0" font-size=11>${nf(yv,ydec)}</text>`;}
 const span=x1-x0,useDay=span>2*86400,nx=4;
 for(let i=0;i<=nx;i++){const xv=x0+span*i/nx,xx=X(xv);
  g+=`<text x=${xx.toFixed(1)} y=${H-12} text-anchor=middle fill="#7d8da0" font-size=11>${useDay?dm(xv):hm(xv)}</text>`;}
 // explicit zero line — separate from the regular grid (which rarely lands exactly on 0) so the
 // import/export crossover is instantly visible on charts that legitimately go negative (power).
 // NOTE: self-closing tags below always keep a literal space before "/>". Without it, an HTML5 parser
 // (unlike a strict XML/SVG parser) reads an unquoted final attribute value as CONTINUING through the "/"
 // (e.g. stroke-width=1.5/> tokenizes as value "1.5/", not value "1.5" + self-close) -- the tag then never
 // actually self-closes, and every following sibling (both polylines, the unit label) gets parsed as a
 // child of it instead, which shape elements like <line>/<polyline> don't render. Cost a debugging session
 // to track down: everything downstream of the zero-line silently vanished with no console error anywhere.
 if(zeroLine&&y0<0&&y1>0){const yz=Y(0);
  g+=`<line x1=${pl} y1=${yz.toFixed(1)} x2=${W-pr} y2=${yz.toFixed(1)} stroke="#7d8da0" stroke-width=1.5 />`;}
 series.forEach(s=>{if(!s.pts.length)return;
  const d=s.pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
  g+=`<polyline points="${d}" fill=none stroke="${s.color}" stroke-width=2 stroke-linejoin=round stroke-linecap=round${s.dash?` stroke-dasharray="${s.dash}"`:''} />`;});
 g+=`<text x=${pl-8} y=11 text-anchor=end fill="#7d8da0" font-size=10>${unit}</text>`;
 return `<svg class=chart viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
// ---- inline SVG bar chart: bars=[{label,value}] ----
function barChart(bars,unit,color){
 const W=760,H=300,pl=58,pr=16,pt=16,pb=42;
 if(!bars.length)return '<div class=empty>'+t('noDay')+'</div>';
 let vmax=Math.max(...bars.map(b=>b.value),0.001),vmin=Math.min(...bars.map(b=>b.value),0);

  g+=`<text x=${pl-8} y=${(yy+4).toFixed(1)} text-anchor=end fill="#7d8da0" font-size=11>${nf(yv,vmax>=10?1:2)}</text>`;}

  if(i%step===0)g+=`<text x=${(x+w/2).toFixed(1)} y=${H-16} text-anchor=middle fill="#7d8da0" font-size=10>${b.label}</text>`;});

}

  let head='<th>'+t('thDay')+'</th><th>'+t('thCons')+'</th>'+(showCost?'<th>'+t('thCost')+'</th>':'')+(showExp?'<th>'+t('thExp')+'</th>':'')+(showEarn?'<th>'+t('thEarn')+'</th>':'');
  let rows=cons.slice(-31).reverse().map(c=>'<tr><td>'+dmy(c.ep)+'</td><td class="mono pos">'+nf(c.imp,2)+'</td>'+(showCost?'<td class="mono euro">'+nf(c.cost,2)+' €</td>':'')+(showExp?'<td class="mono neg">'+nf(c.exp,2)+'</td>':'')+(showEarn?'<td class="mono euro">'+nf(c.exp*eeur,2)+' €</td>':'')+'</tr>').join('');
  html+='<div class=card><h2>'+t('cTbl')+'</h2><p class=cap>'+t('capTbl')+'</p><div class=twrap><table><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
 }
 // hourly values: kWh consumed / fed-in within each local clock hour (from the counter deltas)
 if(S.length>1){
  let hmap={},horder=[];
  for(const s of S){let d=D(s[0]),key=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()+'-'+d.getHours();
   if(!(key in hmap))horder.push(key);hmap[key]={ep:s[0],imp:s[1],exp:s[2]};}   // last sample per hour wins
  let hours=[];
  for(let i=1;i<horder.length;i++){let a=hmap[horder[i-1]],b=hmap[horder[i]],dd=D(b.ep);
   hours.push({label:dm(b.ep)+' '+p2(dd.getHours())+':00',imp:Math.max(0,(b.imp-a.imp)/1000),exp:Math.max(0,(b.exp-a.exp)/1000)});}
  if(hours.length){
   let head='<th>'+t('thHour')+'</th><th>'+t('thCons')+'</th>'+(anyExp?'<th>'+t('thExp')+'</th>':'');
   let rows=hours.slice(-48).reverse().map(x=>`<tr><td>${x.label}</td><td class="mono pos">${nf(x.imp,2)}</td>`+(anyExp?`<td class="mono neg">${nf(x.exp,2)}</td>`:'')+`</tr>`).join('');
   html+='<div class=card><h2>'+t('cHour')+'</h2><p class=cap>'+t('capHour')+'</p><div class=twrap><table><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }
 }
 // watt / raw sample table
 if(S.length){
  const fmtD=d=>d==null?'<span class=na>—</span>':(d>0?'<span class=pos>+'+nf(d,2)+'</span>':(d<0?'<span class=neg>'+nf(d,2)+'</span>':'<span class=na>0</span>'));
  const fmtW=w=>w==null?'<span class=na>—</span>':(w<0?'<span class=neg>'+nf(w,0)+'</span>':nf(w,0));
  let all=S.map((s,i)=>({s,di:i>0?(s[1]-S[i-1][1])/1000:null,de:i>0?(s[2]-S[i-1][2])/1000:null,cw:calcArr[i]}));
  let shown=all.filter(o=>o.s[0]>=rCutoff);   // same shared window as the charts above (header ⏱ select)
  let rows=shown.reverse().map(o=>{
   let s=o.s,pw=s[3]==null?'<span class=na>—</span>':nf(s[3],0);
   return `<tr><td>${dmy(s[0])} ${hm(s[0])}</td><td class="mono">${pw}</td><td class="mono">${fmtW(o.cw)}</td><td class="mono">${nf(s[1]/1000,2)}</td><td class="mono">${fmtD(o.di)}</td>`+
    (anyExp?`<td class="mono">${nf(s[2]/1000,2)}</td><td class="mono">${fmtD(o.de)}</td>`:'')+`</tr>`;}).join('');
  html+='<div class=card><h2>'+t('cWatt')+'</h2><p class=cap>'+t('capWatt')+' ('+shown.length+'/'+all.length+')</p><div class=twrap><table><thead><tr><th>'+t('thTime')+'</th><th>'+t('thPow')+'</th><th>'+t('thPowCalc')+'</th><th>'+t('thImpK')+'</th><th>'+t('thDelta')+'</th>'+(anyExp?'<th>'+t('thExpK')+'</th><th>'+t('thDeltaExp')+'</th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
 }
 // day/night tariff settings for this reader -- deliberately the LAST section on the page (a settings
 // block, not something to read regularly like the charts/tables above). Base/export price lives in the
 // header boxes instead (per-reader now, no global setting) -- see savePrice()/saveEprice(). Raw (not
 // gateway-resolved) override state comes from the `readers` array boot() already fetched, since
 // /api/history only returns the resolved price.
 { const rdr=readers.find(x=>x.id===cur);
   if(rdr){
    const mode=rdr.tariff_mode||0;
    const hw=rdr.ht_win||[0,0,0,0],nw=rdr.nt_win||[0,0,0,0];
    const hi=(id,v)=>'<input id="'+id+'" type=number min=0 max=23 value="'+v+'">';
    html+='<div class=card><h2>'+t('cNight')+'</h2>'+
     '<div><label>'+t('lMode')+'</label><select id=rmode onchange=tariffModeUi()>'+
      '<option value=0'+(mode===0?' selected':'')+'>'+t('mOff')+'</option>'+
      '<option value=1'+(mode===1?' selected':'')+'>'+t('mNight')+'</option>'+
      '<option value=2'+(mode===2?' selected':'')+'>'+t('mHtNt')+'</option>'+
     '</select></div>'+
     '<p class=cap>'+t('capNight')+'</p>'+
     '<div id=rnightbox'+(mode!==1?' hidden':'')+'>'+
      '<div class=grid>'+
       '<div><label>'+t('lNightStart')+'</label><input id=rnstart type=number min=0 max=23 value="'+(rdr.night_start!=null?rdr.night_start:22)+'"></div>'+
       '<div><label>'+t('lNightEnd')+'</label><input id=rnend type=number min=0 max=23 value="'+(rdr.night_end!=null?rdr.night_end:6)+'"></div>'+
       '<div><label>'+t('lNightPrice')+'</label><input id=rnprice type=number step=1 min=0'+(rdr.night_price_cent!=null?' value="'+rdr.night_price_cent+'"':'')+'></div>'+
      '</div>'+
     '</div>'+
     '<div id=rhtntbox'+(mode!==2?' hidden':'')+'>'+
      '<p class=cap>'+t('capHtNt')+'</p>'+
      '<div class=grid>'+
       '<div><label>'+t('lHtPrice')+'</label><input id=rhtp type=number step=1 min=0'+(rdr.ht_price_cent!=null?' value="'+rdr.ht_price_cent+'"':'')+'></div>'+
       '<div><label>'+t('lNtPrice')+'</label><input id=rntp type=number step=1 min=0'+(rdr.nt_price_cent!=null?' value="'+rdr.nt_price_cent+'"':'')+'></div>'+
      '</div>'+
      '<div class=grid>'+
       '<div><label>'+t('lHtWin1')+'</label>'+hi('rht0s',hw[0])+hi('rht0e',hw[1])+'</div>'+
       '<div><label>'+t('lHtWin2')+'</label>'+hi('rht1s',hw[2])+hi('rht1e',hw[3])+'</div>'+
      '</div>'+
      '<div class=grid>'+
       '<div><label>'+t('lNtWin1')+'</label>'+hi('rnt0s',nw[0])+hi('rnt0e',nw[1])+'</div>'+
       '<div><label>'+t('lNtWin2')+'</label>'+hi('rnt1s',nw[2])+hi('rnt1e',nw[3])+'</div>'+
      '</div>'+
     '</div>'+
     '<div class=row><button onclick=saveReaderPrice()>'+t('bSavePrice')+'</button><span class=msg id=rpricemsg></span></div>'+
    '</div>';
   }
 }
 main.innerHTML=html;
}
boot();
</script></body></html>
